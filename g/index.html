<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nomad — a space, shared with you</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../mark.png" />
    <style>
      html, body { margin: 0; min-height: 100vh; background: #131416; color: rgba(242, 240, 236, 0.62); font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; }
      p { font-size: 14px; }
      a { color: #f2f0ec; }
    </style>
    <script>
      /* Links made before 2026-09-15 pointed here; the space itself now
         opens at /desk/, the token still in the hash. */
      (function () {
        var token = location.hash.replace(/^#/, '').replace(/^g=/, '').trim();
        if (/^[0-9a-f]{64}$/.test(token)) location.replace('../desk/#' + token);
      })();
    </script>
  </head>
  <body>
    <p>Opening the space… If nothing happens, <a href="https://nomad.devapps.cc">go to Nomad</a>.</p>
  </body>
</html>
