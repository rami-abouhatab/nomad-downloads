<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nomad Sheets. Jad, 2026-09-02. Same construction as docs.svg.
       Silhouette: a near-square table, two columns by three rows punched through. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F3EE"/>
      <stop offset="1" stop-color="#E3DED6"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52D993"/>
      <stop offset="1" stop-color="#0F8A52"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
    <mask id="cut">
      <rect x="118" y="118" width="276" height="276" rx="40" fill="#fff"/>
      <!-- interior 148..364 x 148..364 ; bars 26 ; cells 95 x 54 -->
      <rect x="148" y="148" width="95" height="54" rx="10" fill="#000"/>
      <rect x="269" y="148" width="95" height="54" rx="10" fill="#000"/>
      <rect x="148" y="228" width="95" height="54" rx="10" fill="#000"/>
      <rect x="269" y="228" width="95" height="54" rx="10" fill="#000"/>
      <rect x="148" y="308" width="95" height="56" rx="10" fill="#000"/>
      <rect x="269" y="308" width="95" height="56" rx="10" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#plate)"/>
  <rect x="118" y="132" width="276" height="276" rx="40" fill="#143D2A" opacity="0.22" filter="url(#soft)"/>
  <g mask="url(#cut)">
    <rect x="118" y="118" width="276" height="276" rx="40" fill="url(#ink)"/>
    <rect x="118" y="118" width="276" height="276" rx="40" fill="url(#body)"/>
  </g>
</svg>
