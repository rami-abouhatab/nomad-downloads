<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nomad Slides. Jad, 2026-09-02. Same construction as docs.svg.
       Silhouette: a landscape slide; a title bar and one content window punched through. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F3EE"/>
      <stop offset="1" stop-color="#E3DED6"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA653"/>
      <stop offset="1" stop-color="#E24E2A"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
    <mask id="cut">
      <rect x="92" y="136" width="328" height="240" rx="38" fill="#fff"/>
      <rect x="134" y="176" width="164" height="34" rx="17" fill="#000"/>
      <rect x="134" y="238" width="244" height="96" rx="20" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#plate)"/>
  <rect x="92" y="150" width="328" height="240" rx="38" fill="#4A2214" opacity="0.22" filter="url(#soft)"/>
  <g mask="url(#cut)">
    <rect x="92" y="136" width="328" height="240" rx="38" fill="url(#ink)"/>
    <rect x="92" y="136" width="328" height="240" rx="38" fill="url(#body)"/>
  </g>
</svg>
